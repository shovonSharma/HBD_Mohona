<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#07050c;overscroll-behavior:none}
body{height:100dvh;touch-action:none;position:relative}
html{padding-top:env(safe-area-inset-top,0px)}
.glow{position:fixed;width:130vmax;height:130vmax;left:50%;top:50%;margin:-65vmax 0 0 -65vmax;pointer-events:none;opacity:.55;transition:opacity 3s ease;will-change:transform}
.g1{background:radial-gradient(circle at 50% 50%,rgba(255,45,117,.5),transparent 38%);transform:translate(-30vmax,-26vmax);animation:d1 26s ease-in-out infinite alternate}
.g2{background:radial-gradient(circle at 50% 50%,rgba(255,150,40,.42),transparent 36%);transform:translate(28vmax,30vmax);animation:d2 32s ease-in-out infinite alternate}
.g3{background:radial-gradient(circle at 50% 50%,rgba(110,70,255,.38),transparent 34%);transform:translate(20vmax,-24vmax);animation:d3 38s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(-10vmax,-4vmax)}}
@keyframes d2{to{transform:translate(8vmax,6vmax)}}
@keyframes d3{to{transform:translate(2vmax,-6vmax)}}
body.party .glow{opacity:1}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 40%,rgba(4,2,8,.75) 100%)}
#photo{position:fixed;display:block;object-fit:cover;pointer-events:none;opacity:0;transform:scale(1.06);
transition:opacity 2.8s ease,transform 3.4s cubic-bezier(.2,.7,.2,1);
-webkit-mask-image:radial-gradient(ellipse closest-side at 50% 47%,#000 60%,transparent 100%);mask-image:radial-gradient(ellipse closest-side at 50% 47%,#000 60%,transparent 100%)}
#photo.on{opacity:1;transform:none}
#c{transition:opacity 2.8s ease}#c.dim{opacity:.3}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}
#ui{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:16px;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 22px);text-align:center}
#msg{margin:0;font-weight:400;display:flex;flex-direction:column;align-items:center;gap:6px}
.hb{font:600 clamp(14px,4.3vw,24px)/1 'Josefin Sans',system-ui,sans-serif;letter-spacing:.3em;white-space:nowrap;text-transform:uppercase;color:#ffd9e6;padding-left:.3em}
.nm{font:400 clamp(54px,18vw,120px)/1 'Abril Fatface',Georgia,'Times New Roman',serif;color:#fff4d6;
text-shadow:0 0 18px rgba(255,79,139,.85),0 0 46px rgba(255,150,40,.55)}
.l{display:inline-block;opacity:0;transform:translateY(34px) scale(.5) rotate(-8deg)}
#msg.on .l{animation:pop .9s cubic-bezier(.2,1.5,.4,1) forwards;animation-delay:calc(var(--i)*80ms)}
@keyframes pop{to{opacity:1;transform:none}}
#rp{font:600 16px/1 'Josefin Sans',system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#fff;background:rgba(255,255,255,.08);
border:1.5px solid rgba(255,255,255,.55);border-radius:999px;min-height:46px;padding:0 28px 0 30px;opacity:0;pointer-events:none;transition:opacity 1s ease}
#rp.on{opacity:1;pointer-events:auto}
#rp:active{background:rgba(255,255,255,.25)}
#gate{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;background:radial-gradient(ellipse at 50% 40%,#3a1448,#07050c 70%)}
#gate b{font:400 clamp(34px,11vw,64px)/1.1 'Abril Fatface',Georgia,serif;color:#fff4d6;text-shadow:0 0 18px rgba(255,79,139,.85),0 0 46px rgba(255,150,40,.55)}
#gate span{font:600 15px/1 'Josefin Sans',system-ui,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#ffd9e6;border:1.5px solid rgba(255,255,255,.55);border-radius:999px;padding:16px 30px 16px 33px}
#mu{position:fixed;z-index:5;display:none;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);font:600 12px/1 'Josefin Sans',system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#fff;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.4);border-radius:999px;min-height:40px;padding:0 16px}

  art=document.createElement('canvas');art.width=w;art.height=h;var a=art.getContext('2d');
  a.drawImage(artImg,0,0,w,h);a.globalCompositeOperation='source-in';
  var gr=a.createLinearGradient(0,(CY-BH/2)*s,0,(CY+BH/2)*s);
  gr.addColorStop(0,"#ffd36b");gr.addColorStop(.5,"#ff5a8f");gr.addColorStop(1,"#a97bff");
  a.fillStyle=gr;a.fillRect(0,0,w,h);
  glowc=document.createElement('canvas');glowc.width=w;glowc.height=h;var b=glowc.getContext('2d');
  try{b.filter='blur('+(5*dpr)+'px)'}catch(e){}
  b.drawImage(art,0,0);ready=true;
}
artImg.onload=function(){if(cw)buildArt()};artImg.src=IMG;
function drawArt(al){
  if(!art)return;var x=ox-CX*sc,y=oy-CY*sc,w=IW*sc,h=IH*sc;
  g.globalAlpha=al*0.55;g.drawImage(glowc,x,y,w,h);g.globalAlpha=al;g.drawImage(art,x,y,w,h);g.globalAlpha=1;
}
document.querySelectorAll('.hb,.nm').forEach(function(el){
  var t=el.textContent;el.textContent='';el.setAttribute('aria-label',t);
  Array.from(t).forEach(function(c){var s=document.createElement('span');s.className='l';s.style.setProperty('--i',idx++);s.textContent=c===' '?'\u00a0':c;el.appendChild(s)})
});
function size(){
  dpr=Math.min(window.devicePixelRatio||1,2);cw=window.innerWidth;ch=window.innerHeight;
  [cv,fv].forEach(function(c){c.width=Math.round(cw*dpr);c.height=Math.round(ch*dpr)});
  var top=parseFloat(getComputedStyle(document.documentElement).paddingTop)||0;
  sc=Math.min(cw*0.94/BW,(ch-top)*0.63/BH);ox=cw/2;oy=top+(ch-top)*0.385;
  g.setTransform(dpr,0,0,dpr,0,0);
  grad=g.createLinearGradient(0,oy-BH*sc/2,0,oy+BH*sc/2);
  grad.addColorStop(0,"#ffd36b");grad.addColorStop(.5,"#ff5a8f");grad.addColorStop(1,"#a97bff");
  photo.style.left=(ox-CX*sc)+'px';photo.style.top=(oy-CY*sc)+'px';photo.style.width=(IW*sc)+'px';photo.style.height=(IH*sc)+'px';
  if(artImg.complete&&artImg.naturalWidth)buildArt();
}
function nAt(p){var r=Math.min(1,p/0.62);r=r*r*(3-2*r);return Math.max(6,Math.round(6+(K-6)*r))}
function tip(tau,n,o,i){
  var x=0,y=0;
  for(var k=0;k<n;k++){var a=D[k*3+1],b=D[k*3+2],t=TAU*D[k*3]*tau,c=Math.cos(t),s=Math.sin(t);x+=a*c-b*s;y+=a*s+b*c}
  o[i]=x;o[i+1]=y;
}
function path(arr,n,from,hx,hy){
  g.beginPath();g.moveTo(ox+arr[from*2]*sc,oy+arr[from*2+1]*sc);
  for(var i=from+1;i<n;i++)g.lineTo(ox+arr[i*2]*sc,oy+arr[i*2+1]*sc);
  if(hx!==undefined)g.lineTo(ox+hx*sc,oy+hy*sc);
}
function line(arr,n,alpha,hx,hy,comet){
  if(n<2||alpha<=0)return;
  g.lineJoin="round";g.lineCap="round";
  path(arr,n,0,hx,hy);
  g.strokeStyle=grad;g.globalAlpha=alpha*0.2;g.lineWidth=9;g.stroke();
  g.globalAlpha=alpha;g.lineWidth=2.2;g.stroke();
  if(comet){var f=Math.max(0,n-110);path(arr,n,f,hx,hy);g.strokeStyle="#fff";g.globalAlpha=0.85;g.lineWidth=3.2;g.stroke()}
}
function circles(tau,n,alpha,o){
  if(alpha<=0)return;
  var m=Math.min(n,40),x=0,y=0;g.lineWidth=1.2;g.strokeStyle="#8eeaff";
  for(var k=0;k<m;k++){
    var a=D[k*3+1],b=D[k*3+2],t=TAU*D[k*3]*tau,c=Math.cos(t),s=Math.sin(t),dx=a*c-b*s,dy=a*s+b*c,r=Math.hypot(a,b)*sc;
    if(r>1.2){g.globalAlpha=alpha*0.38;g.beginPath();g.arc(ox+x*sc,oy+y*sc,r,0,TAU);g.stroke()}
    g.globalAlpha=alpha*0.9;g.beginPath();g.moveTo(ox+x*sc,oy+y*sc);g.lineTo(ox+(x+dx)*sc,oy+(y+dy)*sc);g.stroke();
    x+=dx;y+=dy;
  }
  g.globalAlpha=alpha*0.5;g.beginPath();g.moveTo(ox+x*sc,oy+y*sc);g.lineTo(ox+o[0]*sc,oy+o[1]*sc);g.stroke();
  var X=ox+o[0]*sc,Y=oy+o[1]*sc;
  g.fillStyle="#ff5a8f";g.globalAlpha=alpha*0.3;g.beginPath();g.arc(X,Y,11,0,TAU);g.fill();
  g.fillStyle="#fff";g.globalAlpha=alpha;g.beginPath();g.arc(X,Y,4.2,0,TAU);g.fill();
}
function render(tau,n,ca,ta,ka,comet){
  g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,cw,ch);
  var h=[0,0];if(ca>0||comet)tip(tau,n,h,0);
  line(trail,cnt,ta,h[0],h[1],comet);
  if(ka>0)drawArt(ka);
  circles(tau,n,ca,h);g.globalAlpha=1;
}
var COLS=["#ffd36b","#ff4f8b","#fff4d6","#7ae7ff","#a97bff","#ff9d2e"];
function boom(x,y){
  var c=COLS[(Math.random()*COLS.length)|0],c2=COLS[(Math.random()*COLS.length)|0];
  for(var i=0;i<54;i++){var a=Math.random()*TAU,v=1.6+Math.random()*4;
    parts.push({k:0,x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,d:0.010+Math.random()*0.01,c:i%3?c:c2})}
}
function celebrate(now){
  document.body.classList.add("party");
  for(var i=0;i<130;i++)
    parts.push({k:1,x:Math.random()*cw,y:-20-Math.random()*ch*0.5,vx:(Math.random()-.5)*1.6,vy:2+Math.random()*3,
      r:Math.random()*TAU,vr:(Math.random()-.5)*0.3,w:5+Math.random()*6,l:1,c:COLS[(Math.random()*COLS.length)|0]});
  for(var j=0;j<9;j++)bursts.push({t:now+j*480,x:cw*(0.15+Math.random()*0.7),y:ch*(0.1+Math.random()*0.4)});
  timers.push(setTimeout(function(){msg.classList.add("on")},600));
  timers.push(setTimeout(function(){rp.classList.add("on")},4200));
}
function fxStep(now,dt){
  fg.setTransform(dpr,0,0,dpr,0,0);fg.clearRect(0,0,cw,ch);
  for(var b=bursts.length-1;b>=0;b--)if(now>=bursts[b].t){boom(bursts[b].x,bursts[b].y);bursts.splice(b,1)}
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.k===0){p.vy+=0.05*dt;p.vx*=0.985;p.l-=p.d*dt;fg.globalAlpha=Math.max(0,p.l);fg.fillStyle=p.c;fg.beginPath();fg.arc(p.x,p.y,2.5,0,TAU);fg.fill();if(p.l<=0)parts.splice(i,1)}
    else{p.r+=p.vr*dt;if(p.y>ch*0.85)p.l-=0.02*dt;fg.globalAlpha=Math.max(0,p.l);fg.fillStyle=p.c;fg.save();fg.translate(p.x,p.y);fg.rotate(p.r);fg.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);fg.restore();
      if(p.y>ch+20||p.l<=0)parts.splice(i,1)}
  }
  fg.globalAlpha=1;
}
function frame(now){
  var dt=Math.min(3,(now-(last||now))/16.7);last=now;
  if(!t0)t0=now;
  var p=Math.min(1,(now-t0)/DUR);
  if(phase===0){
    var tgt=Math.min(STEPS,Math.floor(p*STEPS));
    for(;cnt<tgt;cnt++)tip(cnt/STEPS,nAt(cnt/STEPS),trail,cnt*2);
    render(p,nAt(p),1,1,0,true);
    if(p>=1){phase=1;tf=now;celebrate(now)}
  }else if(phase===1){
    var f=Math.min(1,(now-tf)/2600),e=f*f*(3-2*f);render(1,K,1-e,ready?1-e:1,ready?e:0,false);
    if(f>=1){phase=2;render(1,K,0,ready?0:1,ready?1:0,false);timers.push(setTimeout(showPhoto,2000))}
  }
  fxStep(now,dt);
  if(phase<2||parts.length||bursts.length)raf=requestAnimationFrame(frame);
  else{fg.clearRect(0,0,cw,ch);raf=0}
}
function start(){
  cancelAnimationFrame(raf);timers.forEach(clearTimeout);timers=[];size();
  trail=new Float32Array(STEPS*2);cnt=0;phase=0;t0=0;last=0;parts=[];bursts=[];
  msg.classList.remove("on");rp.classList.remove("on");photo.classList.remove("on");cv.classList.remove("dim");document.body.classList.remove("party");
  raf=requestAnimationFrame(frame);
}
rp.addEventListener("click",start);
var rt;window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(function(){
  size();if(phase===2)render(1,K,0,ready?0:1,ready?1:0,false)},120)});
var aud=null,gate=document.getElementById('gate'),mu=document.getElementById('mu');
if(AUDIO_SRC){
  aud=new Audio();aud.src=AUDIO_SRC;aud.loop=true;aud.preload='auto';aud.volume=0.9;
  gate.style.display='flex';
  gate.addEventListener('click',function(){
    gate.style.display='none';mu.style.display='block';
    var pr=aud.play();if(pr&&pr.catch)pr.catch(function(){});
    start();
  },{once:true});
  mu.addEventListener('click',function(){aud.muted=!aud.muted;mu.textContent=aud.muted?'Sound off':'Sound on'});
  document.addEventListener('visibilitychange',function(){
    if(document.hidden)aud.pause();
    else if(gate.style.display==='none'){var q=aud.play();if(q&&q.catch)q.catch(function(){})}
  });
}else start();
})();
</script></body></html>
